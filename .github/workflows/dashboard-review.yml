# Temporary review check for the dashboard update (remove before merging).
name: dashboard-review
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: AppTest (all tabs, every model, several thresholds)
        run: set -o pipefail; python tests/apptest_check.py 2>&1 | tee apptest.txt
      - name: Screenshots
        if: always()
        run: |
          mkdir -p shots
          (streamlit run dashboard.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &)
          sleep 20
          python tests/screenshots.py shots 2>&1 | tee -a apptest.txt
      - name: Save screenshots to branch review-screenshots
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin review-screenshots || true
          git checkout --orphan review-screenshots
          git rm -rf --cached . > /dev/null
          git add -f shots apptest.txt
          git commit -m "Dashboard review screenshots for ${GITHUB_SHA}"
          git push -f origin review-screenshots
      - name: Comment results on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Dashboard review check'; echo; echo "Job status: ${{ job.status }}"; echo; echo '```'; tail -c 60000 apptest.txt; echo '```'; } > body.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.md
