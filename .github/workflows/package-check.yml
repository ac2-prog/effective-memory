# Temporary check for the submission package (removed before merging).
name: package-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt nbconvert ipykernel
      - name: Run scripts in README order and check results are unchanged
        run: |
          set -o pipefail
          { python make_clean_dataset.py && python train_models.py && python extend_evaluation.py && python eda_quality_audit.py; } 2>&1 | tail -40 | tee log.txt
          echo "--- CSV/JSON outputs changed by re-running (should be empty):" | tee -a log.txt
          git diff --stat -- '*.csv' '*.json' | tee -a log.txt
      - name: Execute notebook in Jupyter
        run: |
          set -o pipefail
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 RISKY_workbook.ipynb 2>&1 | tee -a log.txt
          python - <<'PY' | tee -a log.txt
          import json
          nb = json.load(open('RISKY_workbook.ipynb'))
          code = [c for c in nb['cells'] if c['cell_type'] == 'code']
          errs = [o for c in code for o in c['outputs'] if o['output_type'] == 'error']
          imgs = sum(1 for c in code for o in c['outputs'] if 'image/png' in o.get('data', {}))
          txt = ''.join(''.join(o.get('text', '')) for c in code for o in c['outputs'])
          print(f'code cells executed: {sum(1 for c in code if c["execution_count"])}/{len(code)}; errors: {len(errs)}; figures: {imgs}')
          for line in txt.splitlines():
              if line.startswith('Matches'): print(line)
          PY
      - name: Commit executed notebook
        run: |
          git config user.name "ac2-prog"
          git config user.email "332074517+ac2-prog@users.noreply.github.com"
          git checkout -- outputs data validation_outputs || true
          git add RISKY_workbook.ipynb
          git commit -m "Executed notebook with all outputs" || echo "nothing to commit"
          git push origin HEAD:${{ github.head_ref }}
      - name: Comment results on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Submission package check'; echo; echo "Job status: ${{ job.status }}"; echo; echo '```'; tail -c 30000 log.txt; echo '```'; } > body.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.md
